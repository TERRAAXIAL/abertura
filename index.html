<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050305">
  <meta name="description" content="Abertura cinematográfica oficial de Marvel's Terra Axial.">
  <title>Marvel’s Terra Axial — Arquivo de Abertura</title>
  <base href="./">
  <style>
    :root {
      --black: #030203;
      --wine: #23050d;
      --wine-light: #4b0718;
      --red: #f10f31;
      --red-soft: #a40924;
      --silver: #e0e3e8;
      --silver-dim: #9da3ad;
      --green: #61ffad;
      --yellow: #ffd65a;
      --display: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
      --mono: "Courier New", ui-monospace, monospace;
      --safe-top: max(18px, env(safe-area-inset-top));
      --safe-right: max(18px, env(safe-area-inset-right));
      --safe-bottom: max(18px, env(safe-area-inset-bottom));
      --safe-left: max(18px, env(safe-area-inset-left));
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: var(--black); }
    body { overflow: hidden; color: var(--silver); font-family: var(--mono); }
    button, a { font: inherit; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--red); outline-offset: 5px; }

    .page {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100svh;
      min-height: 480px;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      background:
        radial-gradient(circle at 50% 45%, rgba(98, 0, 24, .26), transparent 42%),
        linear-gradient(135deg, #040204, #160309 52%, #030203);
    }

    .media, .video, .fallback, .grade, .vignette, .scanlines, .noise, .grid {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .media { z-index: -5; overflow: hidden; background: var(--black); }
    .video {
      object-fit: cover;
      object-position: center;
      opacity: 0;
      transform: scale(1.035);
      filter: grayscale(.72) contrast(1.3) brightness(.5) saturate(.72);
      transition: opacity 1.45s cubic-bezier(.55,0,.2,1), transform 8s linear;
    }
    .video.active { opacity: 1; transform: scale(1.085); }

    .fallback {
      background:
        radial-gradient(circle at 28% 42%, rgba(241,15,49,.25), transparent 30%),
        radial-gradient(circle at 72% 62%, rgba(89,0,22,.42), transparent 36%),
        linear-gradient(115deg, #030203 0%, #22050e 48%, #050204 100%);
      animation: drift 12s ease-in-out infinite alternate;
    }
    .fallback::before, .fallback::after {
      content: "";
      position: absolute;
      inset: -25%;
      background: conic-gradient(from 45deg, transparent, rgba(241,15,49,.16), transparent 35%);
      filter: blur(45px);
      animation: rotate 27s linear infinite;
    }
    .fallback::after { animation-direction: reverse; animation-duration: 36s; }

    .grade {
      background:
        linear-gradient(90deg, rgba(40,0,10,.62), rgba(241,15,49,.12) 48%, rgba(35,0,9,.65)),
        linear-gradient(180deg, rgba(0,0,0,.45), transparent 32%, rgba(0,0,0,.58));
      mix-blend-mode: color;
    }
    .vignette { box-shadow: inset 0 0 18vw 7vw rgba(0,0,0,.94); }
    .scanlines {
      opacity: .18;
      background: repeating-linear-gradient(180deg, transparent 0 3px, rgba(255,255,255,.075) 4px, transparent 5px);
      animation: scan .18s steps(2) infinite;
    }
    .noise {
      opacity: .16;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.75'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
      animation: noise .28s steps(2) infinite;
    }
    .grid {
      z-index: -1;
      opacity: .13;
      background-image:
        linear-gradient(rgba(241,15,49,.24) 1px, transparent 1px),
        linear-gradient(90deg, rgba(241,15,49,.15) 1px, transparent 1px);
      background-size: 76px 76px;
      mask-image: radial-gradient(circle at center, #000 0 22%, transparent 76%);
    }

    .frame { position: absolute; inset: 14px; pointer-events: none; z-index: 10; }
    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(224,227,232,.09);
      clip-path: polygon(0 18px,18px 0,calc(100% - 70px) 0,calc(100% - 58px) 12px,100% 12px,100% calc(100% - 18px),calc(100% - 18px) 100%,70px 100%,58px calc(100% - 12px),0 calc(100% - 12px));
    }

    .topbar, .bottombar {
      position: relative;
      z-index: 12;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-width: 0;
    }
    .system { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .pulse {
      width: 8px; height: 8px; border-radius: 50%; background: var(--red);
      box-shadow: 0 0 18px var(--red); animation: pulse 1.2s ease-in-out infinite;
      flex: 0 0 auto;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 5px 11px;
      color: #090406;
      font: 700 10px/1 var(--mono);
      letter-spacing: .15em;
      text-transform: uppercase;
      clip-path: polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
    }
    .tag.red { background: var(--red); }
    .tag.yellow { background: var(--yellow); }
    .tag.green { background: var(--green); }
    .micro {
      margin: 6px 0 0;
      color: var(--silver-dim);
      font-size: 9px;
      line-height: 1.25;
      letter-spacing: .13em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stage {
      position: relative;
      z-index: 8;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(58px, .7fr) minmax(120px, 1.25fr) minmax(104px, .78fr);
      align-items: center;
      justify-items: center;
      width: min(1160px, 100%);
      margin-inline: auto;
      padding: clamp(8px, 2vh, 24px) 0;
    }

    .logo-wrap {
      align-self: end;
      width: clamp(170px, 27vw, 410px);
      max-height: 26vh;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 0 30px rgba(241,15,49,.17));
      animation: logoFloat 5.8s ease-in-out infinite;
    }
    .logo-wrap img { display: block; width: 100%; height: auto; object-fit: contain; }

    .copy-zone {
      position: relative;
      width: 100%;
      min-height: clamp(118px, 21vh, 220px);
      display: grid;
      place-items: center;
      text-align: center;
      padding-inline: clamp(6px, 3vw, 42px);
    }
    .copy {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: clamp(10px, 1.6vh, 18px);
      opacity: 0;
      transform: translateY(18px) scale(.985);
      filter: blur(14px);
      pointer-events: none;
    }
    .copy.show { animation: phrase 4s cubic-bezier(.2,.72,.18,1) both; }
    .copy-kicker {
      color: var(--red);
      font: 700 clamp(9px, .82vw, 12px)/1 var(--mono);
      letter-spacing: .22em;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(241,15,49,.8);
    }
    .copy h1 {
      max-width: 1050px;
      margin: 0;
      color: var(--silver);
      font-family: var(--display);
      font-size: clamp(27px, 5.1vw, 80px);
      font-weight: 900;
      font-stretch: condensed;
      line-height: .92;
      letter-spacing: .035em;
      text-transform: uppercase;
      text-wrap: balance;
      text-shadow: 0 0 1px #fff, 0 0 24px rgba(241,15,49,.25), 3px 0 0 rgba(241,15,49,.13), -3px 0 0 rgba(95,255,173,.05);
      animation: textJitter .24s steps(2) infinite;
    }

    .access-slot {
      align-self: start;
      width: 100%;
      min-height: clamp(96px, 16vh, 150px);
      display: grid;
      place-items: start center;
      padding-top: clamp(5px, 1.4vh, 16px);
      pointer-events: none;
    }
    .access {
      display: grid;
      justify-items: center;
      gap: 10px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(18px);
      transition: opacity .9s ease, transform .9s ease, visibility 0s linear .9s;
    }
    .page.unlocked .access {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
      transition-delay: 0s;
    }
    .enter {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: clamp(14px, 3vw, 42px);
      width: min(520px, calc(100vw - 44px));
      min-height: clamp(54px, 7.5vh, 68px);
      padding: 12px clamp(18px, 4vw, 32px);
      color: var(--silver);
      text-decoration: none;
      background: linear-gradient(90deg, rgba(17,3,8,.92), rgba(65,5,20,.82));
      border: 1px solid rgba(241,15,49,.76);
      clip-path: polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
      box-shadow: 0 0 0 1px rgba(255,255,255,.045) inset, 0 12px 44px rgba(0,0,0,.42), 0 0 32px rgba(241,15,49,.12);
      overflow: hidden;
      transition: transform .25s ease, background .25s ease, box-shadow .25s ease;
    }
    .enter::before {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-115%);
      background: linear-gradient(105deg, transparent 25%, rgba(255,255,255,.16), transparent 70%);
      transition: transform .6s ease;
    }
    .enter:hover { transform: translateY(-3px); background: linear-gradient(90deg, rgba(49,4,16,.96), rgba(112,7,30,.92)); box-shadow: 0 15px 48px rgba(0,0,0,.5), 0 0 34px rgba(241,15,49,.25); }
    .enter:hover::before { transform: translateX(115%); }
    .enter strong { font-family: var(--display); font-size: clamp(16px, 2vw, 24px); letter-spacing: .12em; text-transform: uppercase; }
    .enter small { color: var(--red); font-size: clamp(8px, .8vw, 10px); letter-spacing: .14em; white-space: nowrap; }
    .hint { margin: 0; color: var(--silver-dim); font-size: 9px; letter-spacing: .12em; text-align: center; }

    .progress { display: flex; align-items: center; gap: 10px; min-width: min(390px, 42vw); }
    .track { position: relative; flex: 1; height: 2px; background: rgba(224,227,232,.16); overflow: hidden; }
    .track i { display: block; width: 100%; height: 100%; background: var(--red); transform: scaleX(0); transform-origin: left; box-shadow: 0 0 14px var(--red); }
    .percent { min-width: 42px; color: var(--silver); font-size: 10px; letter-spacing: .1em; }
    .source { color: var(--silver-dim); font-size: 9px; letter-spacing: .12em; white-space: nowrap; }
    .source strong { color: var(--silver); font-weight: 400; }

    .sound {
      position: absolute;
      right: var(--safe-right);
      bottom: calc(var(--safe-bottom) + 32px);
      z-index: 15;
      border: 0;
      padding: 7px 10px;
      color: var(--silver-dim);
      background: rgba(5,3,5,.42);
      font: 700 9px/1 var(--mono);
      letter-spacing: .12em;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .sound.on { color: var(--green); }

    @keyframes phrase {
      0% { opacity: 0; transform: translateY(20px) scale(.985); filter: blur(15px); letter-spacing: .08em; }
      16% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      72% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      100% { opacity: 0; transform: translateY(-14px) scale(1.012); filter: blur(12px); }
    }
    @keyframes pulse { 50% { opacity: .35; transform: scale(.72); } }
    @keyframes drift { to { transform: scale(1.08) translate3d(-1.5%,1%,0); } }
    @keyframes rotate { to { transform: rotate(360deg); } }
    @keyframes scan { to { transform: translateY(5px); } }
    @keyframes noise { 0% { transform: translate(0,0); } 25% { transform: translate(2%,-1%); } 50% { transform: translate(-1%,2%); } 75% { transform: translate(1%,1%); } 100% { transform: translate(-2%,-1%); } }
    @keyframes logoFloat { 50% { transform: translateY(-5px); filter: drop-shadow(0 0 36px rgba(241,15,49,.23)); } }
    @keyframes textJitter { 0%,100% { transform: translateX(0); } 35% { transform: translateX(.4px); } 70% { transform: translateX(-.4px); } }

    @media (max-width: 720px) {
      .page { padding-inline: max(14px, env(safe-area-inset-left)); }
      .topbar { align-items: flex-start; }
      .topbar .micro { display: none; }
      .tag { min-height: 21px; padding: 4px 8px; font-size: 8px; }
      .stage { grid-template-rows: minmax(70px,.62fr) minmax(122px,1.28fr) minmax(110px,.82fr); padding-block: 5px; }
      .logo-wrap { width: clamp(155px, 46vw, 260px); max-height: 22vh; }
      .copy-zone { min-height: 122px; padding-inline: 2px; }
      .copy h1 { font-size: clamp(27px, 10.2vw, 49px); line-height: .94; }
      .copy-kicker { font-size: 8px; letter-spacing: .17em; }
      .enter { grid-template-columns: 1fr; justify-items: center; gap: 5px; text-align: center; }
      .source { display: none; }
      .progress { min-width: 0; width: min(260px, 66vw); }
      .sound { bottom: calc(var(--safe-bottom) + 28px); }
    }

    @media (max-height: 680px) {
      .page { min-height: 420px; }
      .stage { grid-template-rows: minmax(48px,.52fr) minmax(106px,1.18fr) minmax(84px,.62fr); padding-block: 0; }
      .logo-wrap { width: clamp(140px, 23vw, 280px); max-height: 18vh; }
      .copy-zone { min-height: 106px; }
      .copy h1 { font-size: clamp(25px, 4.6vw, 58px); }
      .access-slot { min-height: 84px; padding-top: 0; }
      .access { gap: 6px; }
      .access .tag, .hint { display: none; }
      .enter { min-height: 50px; }
      .micro { display: none; }
    }

    @media (max-width: 720px) and (max-height: 620px) {
      .topbar .system:last-child { display: none; }
      .stage { grid-template-rows: minmax(38px,.44fr) minmax(90px,1fr) minmax(68px,.54fr); }
      .logo-wrap { width: 128px; }
      .copy-zone { min-height: 90px; }
      .copy h1 { font-size: clamp(23px, 8.8vw, 38px); }
      .access-slot { min-height: 68px; }
      .enter { min-height: 45px; padding-block: 8px; }
      .sound { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      .video { transition-duration: .2s; }
    }
  </style>
</head>

      <div class="copy-zone">
        <div class="copy" id="copy">
          <span class="copy-kicker" id="kicker">PERGUNTA CENTRAL // FRAGMENTO 01</span>
          <h1 id="phrase">QUEM SÃO ESSES HERÓIS</h1>
        </div>
      </div>

      <div class="access-slot">
        <div class="access" id="access" aria-hidden="true">
          <span class="tag green">ACESSO LIBERADO</span>
          <a class="enter" id="enter" href="https://arquivoaxial.tumblr.com/home" target="_top" rel="noopener">
            <strong>ENTRAR NO ARQUIVO</strong>
            <small>EIXO // 10.00</small>
          </a>
          <p class="hint">A CINEMÁTICA CONTINUARÁ ATIVA ATÉ A CONFIRMAÇÃO.</p>
        </div>
      </div>
    </section>

    <footer class="bottombar">
      <div class="source">FONTE // <strong id="source">CINEMÁTICA 01</strong></div>
      <div class="progress" aria-label="Progresso de liberação do acesso">
        <span class="track"><i id="bar"></i></span>
        <span class="percent" id="percent">000%</span>
      </div>
    </footer>

    <button class="sound" id="sound" type="button" aria-pressed="false">SOM OFF</button>
  </main>

  <script>
    (() => {
      'use strict';

      const CONFIG = {
        redirect: 'https://arquivoaxial.tumblr.com/home',
        unlockMs: 10000,
        phraseMs: 4000,
        videoMs: 5600,
        crossfadeMs: 1450,
        videos: [
          { src: 'https://i.imgur.com/yugM1ib.mp4', label: 'CINEMÁTICA 01' },
          { src: 'https://i.imgur.com/0kNC1jc.mp4', label: 'CINEMÁTICA 02' },
          { src: 'https://i.imgur.com/g8qqry0.mp4', label: 'CINEMÁTICA 03' }
        ],
        phrases: [
          'QUEM SÃO ESSES HERÓIS',
          'SE TIRARMOS TUDO',
          'O QUE OS TORNA CONFORTÁVEIS',
          'E ESTABELECIDOS?'
        ]
      };

      const page = document.getElementById('page');
      const copy = document.getElementById('copy');
      const phrase = document.getElementById('phrase');
      const kicker = document.getElementById('kicker');
      const access = document.getElementById('access');
      const signal = document.getElementById('signal');
      const enter = document.getElementById('enter');
      const bar = document.getElementById('bar');
      const percent = document.getElementById('percent');
      const source = document.getElementById('source');
      const sound = document.getElementById('sound');
      const players = [document.getElementById('videoA'), document.getElementById('videoB')];

      let activePlayer = 0;
      let activeVideo = 0;
      let soundOn = false;
      const start = performance.now();

      function showPhrase(index) {
        phrase.textContent = CONFIG.phrases[index];
        kicker.textContent = `PERGUNTA CENTRAL // FRAGMENTO ${String(index + 1).padStart(2, '0')}`;
        copy.classList.remove('show');
        void copy.offsetWidth;
        copy.classList.add('show');
      }

      let phraseIndex = 0;
      showPhrase(phraseIndex);
      window.setInterval(() => {
        phraseIndex = (phraseIndex + 1) % CONFIG.phrases.length;
        showPhrase(phraseIndex);
      }, CONFIG.phraseMs);

      function progressFrame(now) {
        const ratio = Math.min(1, (now - start) / CONFIG.unlockMs);
        const value = Math.round(ratio * 100);
        bar.style.transform = `scaleX(${ratio})`;
        percent.textContent = `${String(value).padStart(3, '0')}%`;
        if (ratio < 1) {
          requestAnimationFrame(progressFrame);
        } else if (!page.classList.contains('unlocked')) {
          page.classList.add('unlocked');
          access.setAttribute('aria-hidden', 'false');
          signal.textContent = 'SINAL ESTÁVEL';
          signal.classList.remove('yellow');
          signal.classList.add('green');
        }
      }
      requestAnimationFrame(progressFrame);

      function setVideo(playerIndex, videoIndex) {
        const player = players[playerIndex];
        const item = CONFIG.videos[videoIndex];
        if (player.dataset.src !== item.src) {
          player.pause();
          player.src = item.src;
          player.dataset.src = item.src;
          player.load();
        }
        player.muted = !soundOn;
        return player.play().then(() => true).catch(() => false);
      }

      setVideo(0, 0);
      if (CONFIG.videos.length > 1) {
        players[1].src = CONFIG.videos[1].src;
        players[1].dataset.src = CONFIG.videos[1].src;
        players[1].load();
      }

      async function nextVideo() {
        if (document.hidden || CONFIG.videos.length < 2) return;
        const nextVideoIndex = (activeVideo + 1) % CONFIG.videos.length;
        const nextPlayerIndex = activePlayer === 0 ? 1 : 0;
        const incoming = players[nextPlayerIndex];
        const outgoing = players[activePlayer];
        const ok = await setVideo(nextPlayerIndex, nextVideoIndex);
        if (!ok) {
          activeVideo = nextVideoIndex;
          source.textContent = CONFIG.videos[activeVideo].label;
          return;
        }
        incoming.classList.add('active');
        outgoing.classList.remove('active');
        source.textContent = CONFIG.videos[nextVideoIndex].label;
        window.setTimeout(() => outgoing.pause(), CONFIG.crossfadeMs + 100);
        activePlayer = nextPlayerIndex;
        activeVideo = nextVideoIndex;
      }
      window.setInterval(nextVideo, CONFIG.videoMs);

      sound.addEventListener('click', async () => {
        soundOn = !soundOn;
        players.forEach(v => v.muted = !soundOn);
        sound.classList.toggle('on', soundOn);
        sound.textContent = soundOn ? 'SOM ON' : 'SOM OFF';
        sound.setAttribute('aria-pressed', String(soundOn));
        if (soundOn) {
          try { await players[activePlayer].play(); } catch (_) {
            soundOn = false;
            players.forEach(v => v.muted = true);
            sound.classList.remove('on');
            sound.textContent = 'SOM OFF';
            sound.setAttribute('aria-pressed', 'false');
          }
        }
      });

      enter.addEventListener('click', (event) => {
        event.preventDefault();
        if (!page.classList.contains('unlocked')) return;
        window.location.href = CONFIG.redirect;
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) players[activePlayer].pause();
        else players[activePlayer].play().catch(() => {});
      });
    })();
  </script>
